<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Home Finance</title>
  <meta name="description" content="App de economía familiar: controla ingresos, gastos y presupuesto mensual" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ─── TOKENS ─────────────────────────────────────── */
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #21262d;
      --border2:   #30363d;
      --accent:    #7c3aed;
      --accent2:   #8b5cf6;
      --glow:      rgba(124,58,237,.28);
      --green:     #10b981;
      --green-bg:  rgba(16,185,129,.12);
      --red:       #f43f5e;
      --red-bg:    rgba(244,63,94,.12);
      --text:      #e6edf3;
      --muted:     #8b949e;
      --faint:     #484f58;
      --r:         12px;
      --rL:        18px;
      --rF:        9999px;
      --ease:      cubic-bezier(.4,0,.2,1);
    }

    /* ─── RESET ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #080b0f;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input  { font-family: inherit; }

    /* ─── APP SHELL ──────────────────────────────────── */
    #app {
      width: 100%; max-width: 420px;
      height: 100%; max-height: 920px;
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(124,58,237,.12), 0 0 0 1px var(--border);
    }

    /* ─── SCROLL HELPERS ─────────────────────────────── */
    .scroll { overflow-y: auto; overflow-x: hidden; }
    .scroll::-webkit-scrollbar { display: none; }
    .scroll { scrollbar-width: none; }

    /* ─── HEADER ─────────────────────────────────────── */
    header {
      padding: 48px 20px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header-month {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .header-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    /* Balance card */
    .card-balance {
      background: linear-gradient(135deg,#1e0a40,#2d1060 60%,#160b52);
      border: 1px solid rgba(139,92,246,.3);
      border-radius: var(--rL);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }
    .card-balance::before {
      content:'';
      position: absolute; top:-50px; right:-50px;
      width:160px; height:160px;
      background: radial-gradient(circle,rgba(139,92,246,.22),transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .bal-label {
      font-size: 10px; font-weight: 600;
      color: rgba(139,92,246,.75);
      text-transform: uppercase; letter-spacing: 1.1px;
      margin-bottom: 6px;
    }
    .bal-amount {
      font-size: 36px; font-weight: 800;
      color: #fff; letter-spacing: -1.5px; line-height: 1;
      margin-bottom: 14px;
      position: relative; z-index: 1;
    }
    .bal-amount .sym {
      font-size: 20px; font-weight: 600;
      color: rgba(255,255,255,.55); margin-right: 3px;
      vertical-align: top; line-height: 1.7;
    }

    .bal-row {
      display: flex; gap: 20px;
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 12px;
      position: relative; z-index: 1;
    }
    .bal-item { display: flex; flex-direction: column; gap: 3px; }
    .bal-item-label {
      font-size: 9px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .5px;
      color: rgba(255,255,255,.4);
    }
    .bal-item-val { font-size: 14px; font-weight: 700; }
    .bal-item-val.green { color: var(--green); }
    .bal-item-val.red   { color: var(--red);   }
    .bal-item-val.violet{ color: var(--accent2);}

    /* ─── TAB BAR ────────────────────────────────────── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab {
      flex: 1;
      padding: 12px 0;
      font-size: 12px; font-weight: 600;
      color: var(--faint);
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      transition: color .2s var(--ease);
      position: relative;
    }
    .tab i { font-size: 16px; }
    .tab.active { color: var(--accent2); }
    .tab.active::after {
      content: '';
      position: absolute; bottom: 0; left: 20%; right: 20%;
      height: 2px;
      background: var(--accent2);
      border-radius: var(--rF);
    }

    /* ─── MAIN ───────────────────────────────────────── */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view {
      position: absolute; inset: 0;
      display: none;
      padding: 18px;
      overflow-y: auto; overflow-x: hidden;
    }
    .view::-webkit-scrollbar { display: none; }
    .view { scrollbar-width: none; }
    .view.active {
      display: block;
      animation: fadeUp .25s var(--ease) both;
    }
    /* Bottom padding so last card isn't hidden behind FAB */
    .view { padding-bottom: 88px; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ─── SECTION HEADER ─────────────────────────────── */
    .sec-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sec-title { font-size: 14px; font-weight: 700; }
    .sec-link  {
      font-size: 11px; font-weight: 600;
      color: var(--accent2);
      background: rgba(139,92,246,.1);
      padding: 4px 10px; border-radius: var(--rF);
    }

    /* ─── TRANSACTION ITEM ───────────────────────────── */
    .tx-list { display: flex; flex-direction: column; gap: 8px; }

    .tx-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px;
      display: flex; align-items: center; gap: 11px;
      cursor: pointer;
      transition: background .18s var(--ease), transform .12s var(--ease);
    }
    .tx-item:active { background: #1c2128; transform: scale(.98); }

    .tx-icon {
      width: 40px; height: 40px;
      border-radius: var(--r);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
    }
    .tx-info   { flex: 1; min-width: 0; }
    .tx-name   { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tx-amount { font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .tx-amount.green { color: var(--green); }
    .tx-amount.red   { color: var(--red);   }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }
    .empty .ico { font-size: 44px; opacity: .35; margin-bottom: 12px; display: block; }
    .empty h4   { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty p    { font-size: 12px; line-height: 1.5; }

    /* ─── BUDGET VIEW ────────────────────────────────── */
    .budget-summary {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 18px;
    }
    .bsum-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px 8px; text-align: center;
    }
    .bsum-val   { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
    .bsum-label { font-size: 9px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

    .budget-list { display: flex; flex-direction: column; gap: 9px; }

    .bcat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px;
    }
    .bcat.over { border-color: rgba(244,63,94,.4); }

    .bcat-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
    .bcat-ico  {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .bcat-info  { flex: 1; }
    .bcat-name  { font-size: 13px; font-weight: 600; }
    .bcat-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .bcat-pct   { font-size: 13px; font-weight: 700; }

    .bar-track  { height: 6px; background: var(--border); border-radius: var(--rF); overflow: hidden; }
    .bar-fill   { height: 100%; border-radius: var(--rF); transition: width .7s var(--ease); }

    /* ─── FAB ────────────────────────────────────────── */
    #fab {
      position: absolute;
      bottom: 18px; right: 18px;
      width: 54px; height: 54px;
      border-radius: var(--rF);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px var(--glow);
      z-index: 30;
      transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    }
    #fab:hover  { transform: scale(1.07); box-shadow: 0 6px 28px rgba(124,58,237,.5); }
    #fab:active { transform: scale(.93); }

    /* ─── BOTTOM SHEET MODAL ─────────────────────────── */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity .25s var(--ease);
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 12px 20px 32px;
      transform: translateY(100%);
      transition: transform .3s var(--ease);
      max-height: 88vh;
      overflow-y: auto;
    }
    .sheet::-webkit-scrollbar { display: none; }
    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 36px; height: 4px;
      background: var(--border2);
      border-radius: var(--rF);
      margin: 0 auto 18px;
    }
    .sheet-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 18px; }

    /* Type toggle */
    .type-toggle {
      display: flex; gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 4px; margin-bottom: 18px;
    }
    .tt-btn {
      flex: 1; padding: 10px;
      border-radius: 8px;
      font-size: 13px; font-weight: 700;
      color: var(--muted);
      transition: all .2s var(--ease);
    }
    .tt-btn.sel-exp { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(244,63,94,.25); }
    .tt-btn.sel-inc { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,.25); }

    /* Form */
    .field { margin-bottom: 14px; }
    .label {
      display: block;
      font-size: 10px; font-weight: 700;
      color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 6px;
    }
    .inp {
      width: 100%;
      background: var(--bg); border: 1px solid var(--border2);
      border-radius: var(--r); color: var(--text);
      font-size: 15px; font-weight: 600;
      padding: 13px 15px; outline: none;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
      -webkit-appearance: none;
    }
    .inp:focus  { border-color: var(--accent2); box-shadow: 0 0 0 3px var(--glow); }
    .inp.big    { font-size: 30px; font-weight: 800; text-align: center; padding: 14px; letter-spacing: -1px; }

    /* Category grid */
    .cat-grid {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
    }
    .cat-btn {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      padding: 9px 4px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--bg);
      transition: all .18s var(--ease);
    }
    .cat-btn.sel { border-color: var(--accent2); background: rgba(139,92,246,.1); }
    .cat-btn .ce { font-size: 20px; }
    .cat-btn .cl { font-size: 9px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.3; }
    .cat-btn.sel .cl { color: var(--accent2); }

    /* Submit */
    .btn-save {
      width: 100%; padding: 14px;
      border-radius: var(--r);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-size: 15px; font-weight: 700;
      box-shadow: 0 4px 16px var(--glow);
      transition: opacity .18s var(--ease), transform .12s var(--ease);
      margin-top: 6px;
    }
    .btn-save:active { transform: scale(.98); opacity: .88; }

    /* Delete button inside edit sheet */
    .btn-delete {
      width: 100%; padding: 13px;
      border-radius: var(--r);
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(244,63,94,.25);
      font-size: 14px; font-weight: 700;
      transition: opacity .18s var(--ease), transform .12s var(--ease);
      margin-top: 8px;
    }
    .btn-delete:active { transform: scale(.98); opacity: .8; }

    /* Action sheet (edit / delete options) */
    .action-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      border-radius: var(--r);
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: background .15s var(--ease);
    }
    .action-item:active { background: #1c2128; }
    .action-item .ai-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }

    /* Editable home title */
    .header-title-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      font-size: 22px; font-weight: 800; letter-spacing: -.4px;
      color: var(--text);
      padding: 0;
    }
    .header-title-btn .edit-ico {
      font-size: 13px; color: var(--faint);
      opacity: 0; transition: opacity .2s;
    }
    .header-title-btn:hover .edit-ico { opacity: 1; }

    /* Edit tx icon on each row */
    .tx-edit-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: var(--faint);
      flex-shrink: 0;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .tx-item:hover .tx-edit-btn { background: var(--border); color: var(--muted); }

    /* ─── TOAST ──────────────────────────────────────── */
    #toast {
      position: absolute;
      bottom: 86px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: var(--r);
      padding: 10px 18px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
      opacity: 0; pointer-events: none;
      transition: all .25s var(--ease);
      z-index: 200; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>

  <!-- FontAwesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
<div id="app">

  <!-- ══ HEADER ══════════════════════════════════════════ -->
  <header>
    <div class="header-row">
      <div>
        <div class="header-month" id="hdr-month">Julio 2026</div>
        <button class="header-title-btn" onclick="openNameSheet()" title="Editar nombre del hogar">
          <span id="hdr-name">Home Finance 🏠</span>
          <i class="fa-solid fa-pen edit-ico"></i>
        </button>
      </div>
    </div>

    <!-- Balance card -->
    <div class="card-balance">
      <div class="bal-label">Saldo disponible este mes</div>
      <div class="bal-amount"><span class="sym">€</span><span id="bal-total">0,00</span></div>
      <div class="bal-row">
        <div class="bal-item">
          <span class="bal-item-label">↑ Ingresos</span>
          <span class="bal-item-val green" id="bal-inc">€ 0,00</span>
        </div>
        <div class="bal-item">
          <span class="bal-item-label">↓ Gastos</span>
          <span class="bal-item-val red" id="bal-exp">€ 0,00</span>
        </div>
        <div class="bal-item">
          <span class="bal-item-label">💰 Ahorro</span>
          <span class="bal-item-val violet" id="bal-sav">€ 0,00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ══ TAB BAR ═════════════════════════════════════════ -->
  <div class="tabs">
    <button class="tab active" id="tab-home"   onclick="goTab('home',   this)"><i class="fa-solid fa-list"></i>Movimientos</button>
    <button class="tab"        id="tab-budget" onclick="goTab('budget', this)"><i class="fa-solid fa-chart-pie"></i>Presupuesto</button>
  </div>

  <!-- ══ MAIN ════════════════════════════════════════════ -->
  <main>

    <!-- VIEW: MOVIMIENTOS -->
    <div class="view active" id="view-home">
      <div class="sec-header">
        <span class="sec-title">Este mes</span>
        <span id="tx-count" style="font-size:11px;color:var(--muted);">0 movimientos</span>
      </div>
      <div class="tx-list" id="tx-list"></div>
    </div>

    <!-- VIEW: PRESUPUESTO -->
    <div class="view" id="view-budget">

      <!-- Summary -->
      <div class="budget-summary">
        <div class="bsum-card">
          <div class="bsum-val red"    id="b-spent">€ 0</div>
          <div class="bsum-label">Gastado</div>
        </div>
        <div class="bsum-card">
          <div class="bsum-val" style="color:var(--accent2)" id="b-limit">€ 0</div>
          <div class="bsum-label">Límite</div>
        </div>
        <div class="bsum-card">
          <div class="bsum-val green" id="b-left">€ 0</div>
          <div class="bsum-label">Restante</div>
        </div>
      </div>

      <div class="sec-header" style="margin-bottom:10px;">
        <span class="sec-title">Por categoría</span>
        <button class="sec-link" onclick="openLimitsSheet()">Editar límites</button>
      </div>

      <div class="budget-list" id="budget-list"></div>
    </div>

  </main>

  <!-- FAB -->
  <button id="fab" onclick="openAddSheet()" aria-label="Añadir transacción">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- ══ MODAL: AÑADIR TRANSACCIÓN ═══════════════════════ -->
  <div class="overlay" id="add-overlay" onclick="closeOnBg(event,'add-overlay')">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">Nueva transacción</div>

      <!-- Gasto / Ingreso -->
      <div class="type-toggle">
        <button class="tt-btn sel-exp" id="tt-exp" onclick="setType('expense')">
          <i class="fa-solid fa-arrow-trend-down" style="margin-right:5px;"></i>Gasto
        </button>
        <button class="tt-btn" id="tt-inc" onclick="setType('income')">
          <i class="fa-solid fa-arrow-trend-up" style="margin-right:5px;"></i>Ingreso
        </button>
      </div>

      <!-- Importe -->
      <div class="field">
        <label class="label" for="f-amount">Importe (€)</label>
        <input class="inp big" type="number" inputmode="decimal" id="f-amount" placeholder="0,00" min="0" step="0.01" />
      </div>

      <!-- Descripción -->
      <div class="field">
        <label class="label" for="f-desc">Descripción</label>
        <input class="inp" type="text" id="f-desc" placeholder="Ej: Mercadona" maxlength="60" />
      </div>

      <!-- Categoría -->
      <div class="field">
        <label class="label">Categoría</label>
        <div class="cat-grid" id="cat-grid"></div>
      </div>

      <!-- Fecha -->
      <div class="field">
        <label class="label" for="f-date">Fecha</label>
        <input class="inp" type="date" id="f-date" />
      </div>

      <button class="btn-save" onclick="saveTransaction()">
        <i class="fa-solid fa-check" style="margin-right:7px;"></i>Guardar
      </button>
    </div>
  </div>

  <!-- ══ MODAL: EDITAR LÍMITES ════════════════════════════ -->
  <div class="overlay" id="limits-overlay" onclick="closeOnBg(event,'limits-overlay')">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">Presupuesto mensual</div>
      <div id="limits-list" style="display:flex;flex-direction:column;gap:9px;margin-bottom:16px;"></div>
      <button class="btn-save" onclick="saveLimits()">
        <i class="fa-solid fa-floppy-disk" style="margin-right:7px;"></i>Guardar límites
      </button>
    </div>
  </div>

  <!-- ══ MODAL: EDITAR TRANSACCIÓN ══════════════════════════ -->
  <div class="overlay" id="edit-overlay" onclick="closeOnBg(event,'edit-overlay')">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">Editar transacción</div>

      <div class="type-toggle">
        <button class="tt-btn sel-exp" id="et-exp" onclick="setEditType('expense')">
          <i class="fa-solid fa-arrow-trend-down" style="margin-right:5px;"></i>Gasto
        </button>
        <button class="tt-btn" id="et-inc" onclick="setEditType('income')">
          <i class="fa-solid fa-arrow-trend-up" style="margin-right:5px;"></i>Ingreso
        </button>
      </div>

      <div class="field">
        <label class="label" for="ef-amount">Importe (€)</label>
        <input class="inp big" type="number" inputmode="decimal" id="ef-amount" placeholder="0,00" min="0" step="0.01" />
      </div>

      <div class="field">
        <label class="label" for="ef-desc">Descripción</label>
        <input class="inp" type="text" id="ef-desc" placeholder="Ej: Mercadona" maxlength="60" />
      </div>

      <div class="field">
        <label class="label">Categoría</label>
        <div class="cat-grid" id="edit-cat-grid"></div>
      </div>

      <div class="field">
        <label class="label" for="ef-date">Fecha</label>
        <input class="inp" type="date" id="ef-date" />
      </div>

      <button class="btn-save" onclick="updateTransaction()">
        <i class="fa-solid fa-check" style="margin-right:7px;"></i>Guardar cambios
      </button>
      <button class="btn-delete" onclick="deleteTransaction()">
        <i class="fa-solid fa-trash" style="margin-right:7px;"></i>Eliminar transacción
      </button>
    </div>
  </div>

  <!-- ══ MODAL: NOMBRE DEL HOGAR ══════════════════════════════ -->
  <div class="overlay" id="name-overlay" onclick="closeOnBg(event,'name-overlay')">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">Nombre del hogar</div>
      <div class="field">
        <label class="label" for="f-homename">Cómo se llama tu hogar</label>
        <input class="inp" type="text" id="f-homename" placeholder="Ej: Casa Familia García" maxlength="40" />
      </div>
      <button class="btn-save" onclick="saveHomeName()">
        <i class="fa-solid fa-check" style="margin-right:7px;"></i>Guardar
      </button>
    </div>
  </div>

  <!-- ══ TOAST ════════════════════════════════════════════ -->
  <div id="toast"></div>

</div><!-- /#app -->

<script>
/* ═══════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */
const CATS = [
  { id:'alimentacion', label:'Alimentación', e:'🛒', c:'#f97316', bg:'rgba(249,115,22,.12)' },
  { id:'hogar',        label:'Hogar',        e:'🏠', c:'#3b82f6', bg:'rgba(59,130,246,.12)'  },
  { id:'transporte',   label:'Transporte',   e:'🚗', c:'#eab308', bg:'rgba(234,179,8,.12)'   },
  { id:'salud',        label:'Salud',        e:'💊', c:'#ec4899', bg:'rgba(236,72,153,.12)'  },
  { id:'ocio',         label:'Ocio',         e:'🎮', c:'#8b5cf6', bg:'rgba(139,92,246,.12)'  },
  { id:'suscripc',     label:'Suscripc.',    e:'📱', c:'#06b6d4', bg:'rgba(6,182,212,.12)'   },
  { id:'ropa',         label:'Ropa',         e:'👕', c:'#10b981', bg:'rgba(16,185,129,.12)'  },
  { id:'educacion',    label:'Educación',    e:'📚', c:'#6366f1', bg:'rgba(99,102,241,.12)'  },
  { id:'nomina',       label:'Nómina',       e:'💼', c:'#10b981', bg:'rgba(16,185,129,.12)'  },
  { id:'otros',        label:'Otros',        e:'💰', c:'#84cc16', bg:'rgba(132,204,22,.12)'  },
];

const EXP_IDS = ['alimentacion','hogar','transporte','salud','ocio','suscripc','ropa','educacion','otros'];
const INC_IDS = ['nomina','otros'];

const DEF_LIMITS = {
  alimentacion:500, hogar:800, transporte:150,
  salud:100, ocio:150, suscripc:50,
  ropa:100, educacion:80, otros:100
};

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let transactions = [];
let limits       = {};          // { "2026-07": { alimentacion:500, ... } }
let homeName     = 'Home Finance 🏠';
let txType       = 'expense';
let selCat       = 'alimentacion';
let editTxType   = 'expense';
let editSelCat   = 'alimentacion';
let editingTxId  = null;

/* ═══════════════════════════════════════════════════════════
   STORAGE  (swap keys with Firebase later)
═══════════════════════════════════════════════════════════ */
function load() {
  try {
    transactions = JSON.parse(localStorage.getItem('hf2_tx')   || '[]');
    limits       = JSON.parse(localStorage.getItem('hf2_lim')  || '{}');
    homeName     = localStorage.getItem('hf2_name') || 'Home Finance 🏠';
  } catch(e) {}
}
function save() {
  localStorage.setItem('hf2_tx',   JSON.stringify(transactions));
  localStorage.setItem('hf2_lim',  JSON.stringify(limits));
  localStorage.setItem('hf2_name', homeName);
}

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function fmt(n) {
  return new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
}
function nowKey() {
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function fmtDate(s) {
  const d = new Date(s+'T12:00:00');
  return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}
function getCat(id) { return CATS.find(c=>c.id===id)||CATS[CATS.length-1]; }
function getLimits() { return limits[nowKey()] || {...DEF_LIMITS}; }
function monthTx()  { return transactions.filter(t=>t.date.startsWith(nowKey())); }
function esc(s)     { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok ? 'rgba(16,185,129,.4)' : 'rgba(244,63,94,.4)';
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════ */
function updateHeader() {
  const d  = new Date();
  document.getElementById('hdr-month').textContent = `${MESES[d.getMonth()]} ${d.getFullYear()}`;

  const txs = monthTx();
  const inc = txs.filter(t=>t.type==='income' ).reduce((s,t)=>s+t.amount,0);
  const exp = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const sav = inc - exp;

  document.getElementById('bal-total').textContent = fmt(sav);
  document.getElementById('bal-inc').textContent   = '€ '+fmt(inc);
  document.getElementById('bal-exp').textContent   = '€ '+fmt(exp);
  document.getElementById('bal-sav').textContent   = '€ '+fmt(Math.max(0,sav));
}

/* ═══════════════════════════════════════════════════════════
   TAB NAVIGATION
═══════════════════════════════════════════════════════════ */
function goTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-'+id).classList.add('active');
  if (id==='budget') renderBudget();
}

/* ═══════════════════════════════════════════════════════════
   VIEW: MOVIMIENTOS
═══════════════════════════════════════════════════════════ */
function renderHome() {
  updateHeader();
  const txs  = [...transactions].sort((a,b)=>new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'));
  const list = document.getElementById('tx-list');
  document.getElementById('tx-count').textContent = txs.length + ' movimiento'+(txs.length!==1?'s':'');

  if (!txs.length) {
    list.innerHTML = `
      <div class="empty">
        <span class="ico">💸</span>
        <h4>Sin movimientos todavía</h4>
        <p>Pulsa el botón <strong style="color:#8b5cf6">+</strong> para registrar tu primer gasto o ingreso</p>
      </div>`;
    return;
  }

  list.innerHTML = txs.map(t => {
    const cat = getCat(t.category);
    const sign = t.type==='expense' ? '-' : '+';
    const cls  = t.type==='expense' ? 'red' : 'green';
    return `
      <div class="tx-item" onclick="openEditSheet(${t.id})">
        <div class="tx-icon" style="background:${cat.bg}">${cat.e}</div>
        <div class="tx-info">
          <div class="tx-name">${esc(t.desc)}</div>
          <div class="tx-meta">${fmtDate(t.date)} · ${cat.label}</div>
        </div>
        <div class="tx-amount ${cls}">${sign}€ ${fmt(t.amount)}</div>
        <div class="tx-edit-btn"><i class="fa-solid fa-pen-to-square"></i></div>
      </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   VIEW: PRESUPUESTO
═══════════════════════════════════════════════════════════ */
function renderBudget() {
  const lims = getLimits();
  const txs  = monthTx();

  const totalExp   = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const totalLimit = EXP_IDS.reduce((s,id)=>s+(lims[id]||0),0);
  const left       = totalLimit - totalExp;

  document.getElementById('b-spent').textContent = '€ '+fmt(totalExp);
  document.getElementById('b-limit').textContent = '€ '+fmt(totalLimit);
  document.getElementById('b-left').textContent  = '€ '+fmt(Math.abs(left));
  document.getElementById('b-left').className    = 'bsum-val '+(left<0?'red':'green');

  const expCats = CATS.filter(c=>EXP_IDS.includes(c.id));

  document.getElementById('budget-list').innerHTML = expCats.map(cat=>{
    const spent = txs.filter(t=>t.type==='expense'&&t.category===cat.id).reduce((s,t)=>s+t.amount,0);
    const lim   = lims[cat.id]||0;
    const pct   = lim>0 ? Math.min(100,Math.round(spent/lim*100)) : (spent>0?100:0);
    const isOvr = lim>0 && spent>lim;
    const isWrn = !isOvr && pct>80;
    const barC  = isOvr?'#f43f5e': isWrn?'#f59e0b': cat.c;
    const pctC  = barC;

    return `
      <div class="bcat ${isOvr?'over':''}">
        <div class="bcat-top">
          <div class="bcat-ico" style="background:${cat.bg}">${cat.e}</div>
          <div class="bcat-info">
            <div class="bcat-name">${cat.label}</div>
            <div class="bcat-sub">€ ${fmt(spent)} de € ${fmt(lim)}</div>
          </div>
          <div class="bcat-pct" style="color:${pctC}">${isOvr?'⚠ ':''}${pct}%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${barC}"></div>
        </div>
      </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   MODAL: ADD TRANSACTION
═══════════════════════════════════════════════════════════ */
function openAddSheet() {
  document.getElementById('f-amount').value = '';
  document.getElementById('f-desc').value   = '';
  document.getElementById('f-date').value   = new Date().toISOString().slice(0,10);
  setType('expense');
  document.getElementById('add-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-amount').focus(), 360);
}

function setType(type) {
  txType = type;
  document.getElementById('tt-exp').className = 'tt-btn'+(type==='expense'?' sel-exp':'');
  document.getElementById('tt-inc').className = 'tt-btn'+(type==='income' ?' sel-inc':'');
  selCat = type==='expense' ? 'alimentacion' : 'nomina';
  renderCatGrid();
}

function renderCatGrid() {
  const ids  = txType==='expense' ? EXP_IDS : INC_IDS;
  const cats = CATS.filter(c=>ids.includes(c.id));
  document.getElementById('cat-grid').innerHTML = cats.map(cat=>`
    <button class="cat-btn ${selCat===cat.id?'sel':''}" onclick="pickCat('${cat.id}')">
      <span class="ce">${cat.e}</span>
      <span class="cl">${cat.label}</span>
    </button>`).join('');
}

function pickCat(id) { selCat=id; renderCatGrid(); }

function saveTransaction() {
  const amount = parseFloat(document.getElementById('f-amount').value);
  const desc   = document.getElementById('f-desc').value.trim();
  const date   = document.getElementById('f-date').value;

  if (!amount||amount<=0) { toast('⚠ Introduce un importe válido',false); return; }
  if (!desc)              { toast('⚠ Escribe una descripción',false);     return; }
  if (!date)              { toast('⚠ Selecciona una fecha',false);        return; }

  transactions.push({ id:Date.now(), type:txType, amount, desc, category:selCat, date });
  save();
  closeSheet('add-overlay');
  renderHome();
  const cat = getCat(selCat);
  toast(`${cat.e} ${txType==='expense'?'Gasto':'Ingreso'} guardado`);
}

/* ═══════════════════════════════════════════════════════════
   MODAL: EDIT TRANSACTION
═══════════════════════════════════════════════════════════ */
function openEditSheet(id) {
  const tx = transactions.find(t => t.id === id);
  if (!tx) return;
  editingTxId = id;

  document.getElementById('ef-amount').value = tx.amount;
  document.getElementById('ef-desc').value   = tx.desc;
  document.getElementById('ef-date').value   = tx.date;
  setEditType(tx.type);
  editSelCat = tx.category;
  renderEditCatGrid();

  document.getElementById('edit-overlay').classList.add('open');
}

function setEditType(type) {
  editTxType = type;
  document.getElementById('et-exp').className = 'tt-btn'+(type==='expense'?' sel-exp':'');
  document.getElementById('et-inc').className = 'tt-btn'+(type==='income' ?' sel-inc':'');
  if (type !== editTxType || !editSelCat) {
    editSelCat = type==='expense' ? 'alimentacion' : 'nomina';
  }
  renderEditCatGrid();
}

function renderEditCatGrid() {
  const ids  = editTxType==='expense' ? EXP_IDS : INC_IDS;
  const cats = CATS.filter(c=>ids.includes(c.id));
  document.getElementById('edit-cat-grid').innerHTML = cats.map(cat=>`
    <button class="cat-btn ${editSelCat===cat.id?'sel':''}" onclick="pickEditCat('${cat.id}')">
      <span class="ce">${cat.e}</span>
      <span class="cl">${cat.label}</span>
    </button>`).join('');
}

function pickEditCat(id) { editSelCat=id; renderEditCatGrid(); }

function updateTransaction() {
  const amount = parseFloat(document.getElementById('ef-amount').value);
  const desc   = document.getElementById('ef-desc').value.trim();
  const date   = document.getElementById('ef-date').value;

  if (!amount||amount<=0) { toast('⚠ Introduce un importe válido',false); return; }
  if (!desc)              { toast('⚠ Escribe una descripción',false);     return; }
  if (!date)              { toast('⚠ Selecciona una fecha',false);        return; }

  const idx = transactions.findIndex(t => t.id === editingTxId);
  if (idx === -1) return;

  transactions[idx] = { ...transactions[idx], type:editTxType, amount, desc, category:editSelCat, date };
  save();
  closeSheet('edit-overlay');
  renderHome();
  toast('✅ Transacción actualizada');
}

function deleteTransaction() {
  if (!confirm('¿Eliminar esta transacción?')) return;
  transactions = transactions.filter(t => t.id !== editingTxId);
  save();
  closeSheet('edit-overlay');
  renderHome();
  toast('🗑 Transacción eliminada');
}

/* ═══════════════════════════════════════════════════════════
   MODAL: NOMBRE DEL HOGAR
═══════════════════════════════════════════════════════════ */
function openNameSheet() {
  document.getElementById('f-homename').value = homeName;
  document.getElementById('name-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-homename').focus(), 320);
}

function saveHomeName() {
  const val = document.getElementById('f-homename').value.trim();
  if (!val) { toast('⚠ El nombre no puede estar vacío',false); return; }
  homeName = val;
  document.getElementById('hdr-name').textContent = homeName;
  save();
  closeSheet('name-overlay');
  toast('🏠 Nombre guardado');
}

/* ═══════════════════════════════════════════════════════════
   MODAL: EDIT LIMITS
═══════════════════════════════════════════════════════════ */
function openLimitsSheet() {
  const lims = getLimits();
  const expCats = CATS.filter(c=>EXP_IDS.includes(c.id));

  document.getElementById('limits-list').innerHTML = expCats.map(cat=>`
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);
                padding:11px 14px;display:flex;align-items:center;gap:12px;">
      <span style="font-size:19px;width:24px;text-align:center">${cat.e}</span>
      <span style="font-size:13px;font-weight:500;flex:1;color:var(--text)">${cat.label}</span>
      <input type="number" id="lim-${cat.id}" value="${lims[cat.id]||0}" min="0" step="10"
        style="width:76px;background:var(--surface);border:1px solid var(--border2);
               border-radius:8px;color:var(--text);font-size:13px;font-weight:700;
               padding:6px 8px;text-align:right;outline:none;" />
    </div>`).join('');

  document.getElementById('limits-overlay').classList.add('open');
}

function saveLimits() {
  const mk = nowKey();
  const expCats = CATS.filter(c=>EXP_IDS.includes(c.id));
  const obj = {};
  expCats.forEach(cat => { obj[cat.id] = parseFloat(document.getElementById('lim-'+cat.id).value)||0; });
  limits[mk] = obj;
  save();
  closeSheet('limits-overlay');
  renderBudget();
  toast('✅ Límites guardados');
}

/* ═══════════════════════════════════════════════════════════
   OVERLAY HELPERS
═══════════════════════════════════════════════════════════ */
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function closeOnBg(e, id) { if (e.target.id===id) closeSheet(id); }

/* ═══════════════════════════════════════════════════════════
   DEMO DATA (only if storage is empty)
═══════════════════════════════════════════════════════════ */
function seedDemo() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');

  transactions = [
    { id:1, type:'income',  amount:1800,  desc:'Nómina',            category:'nomina',        date:`${y}-${m}-05` },
    { id:2, type:'income',  amount:600,   desc:'Nómina pareja',     category:'nomina',        date:`${y}-${m}-05` },
    { id:3, type:'expense', amount:65.30, desc:'Mercadona',         category:'alimentacion',  date:`${y}-${m}-15` },
    { id:4, type:'expense', amount:42.00, desc:'Recibo luz',        category:'hogar',         date:`${y}-${m}-14` },
    { id:5, type:'expense', amount:35.00, desc:'Gasolina',          category:'transporte',    date:`${y}-${m}-13` },
    { id:6, type:'expense', amount:15.99, desc:'Netflix + Spotify', category:'suscripc',      date:`${y}-${m}-01` },
    { id:7, type:'expense', amount:89.50, desc:'Ropa niños',        category:'ropa',          date:`${y}-${m}-10` },
    { id:8, type:'expense', amount:28.40, desc:'Farmacia',          category:'salud',         date:`${y}-${m}-08` },
  ];
  limits[`${y}-${m}`] = {...DEF_LIMITS};
  save();
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
(function init() {
  load();
  if (!transactions.length) seedDemo();
  renderCatGrid();
  renderEditCatGrid();
  document.getElementById('hdr-name').textContent = homeName;
  renderHome();
})();
</script>
</body>
</html>
